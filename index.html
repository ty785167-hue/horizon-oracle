<!DOCTYPE html>
<html lang="ja" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanmei AI Console</title>
    <style>
        :root { --accent: #ffd700; --text: #e2e8f0; }
        body { font-family: sans-serif; margin: 0; padding: 15px; color: var(--text); background: #020617; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        .box { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 20px; border: 1.5px solid var(--accent); margin-top: 20px; }
        input, textarea { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--accent); background: #000; color: #fff; }
        .btn { background: var(--accent); color: #000; padding: 12px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
        #response { margin-top: 20px; padding: 15px; border-left: 3px solid var(--accent); text-align: left; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔮 算命学 AI 鑑定</h2>
    <div id="date-now"></div>

    <div class="box">
        <div style="font-size:0.8rem; color:var(--accent);">1. Gemini APIキーを貼り付けて保存</div>
        <input type="password" id="api-key" placeholder="AIzaSy...で始まるキーを貼り付け" onchange="saveKey()">
        <div id="status" style="font-size:0.7rem; color:#0f0; display:none;">✓ キーを保存しました</div>
    </div>

    <div class="box">
        <div style="font-size:0.8rem; color:var(--accent);">2. 相談内容を入力</div>
        <textarea id="user-input" placeholder="例：今日は連絡してもいい？"></textarea>
        <button class="btn" onclick="askAI()">星の導きを聞く</button>
        <div id="response"></div>
    </div>
</div>

<script>
    function saveKey() {
        const val = document.getElementById('api-key').value.trim();
        localStorage.setItem('my_ai_key', val);
        document.getElementById('status').style.display = "block";
    }

    window.onload = () => {
        const saved = localStorage.getItem('my_ai_key');
        if(saved) {
            document.getElementById('api-key').value = saved;
            document.getElementById('status').style.display = "block";
        }
        document.getElementById('date-now').innerText = new Date().toLocaleDateString();
    };

    async function askAI() {
        const key = localStorage.getItem('my_ai_key');
        const input = document.getElementById('user-input').value;
        const resDiv = document.getElementById('response');
        if (!key) return alert("APIキーを保存してください");

        resDiv.style.display = "block";
        resDiv.innerHTML = "AI鑑定士が星を読み解いています...";

        const prompt = `あなたはプロの算命学鑑定士です。宿命（1979/11/30, 男, 辛丑/乙亥/己未）を元に答えて。相談：${input}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            if(data.error) throw new Error(data.error.message);
            resDiv.innerHTML = data.candidates[0].content.parts[0].text;
        } catch (e) {
            resDiv.innerHTML = "エラー: キーが正しくないか、Google側で無効です。\n" + e.message;
        }
    }
</script>
</body>
</html>
